<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bevy 3D Scene — NotGoodAtCoding</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a class="site-title" href="/">NotGoodAtCoding</a>
    <nav>
      <a href="/">home</a>
      <a href="/playground/" aria-current="page">playground</a>
      <a href="/about.html">about</a>
    </nav>
  </header>

  <main class="wide">
    <h1>Bevy 3D Scene</h1>
    <div class="meta">
      <span class="tag">rust · bevy · webgl2</span>
      <span>Rendered into an embedded canvas</span>
    </div>

    <div class="stage">
      <canvas id="bevy-canvas"></canvas>
      <div id="status" class="status">Loading Bevy WebGL2 module…</div>
    </div>

    <p class="muted">
      Compiled from Rust with Bevy targeting <code>wasm32-unknown-unknown</code> and the WebGL2 backend.
    </p>
  </main>

  <footer>
    <a href="/playground/">← all playgrounds</a>
  </footer>

  <script type="module">
    const status = document.getElementById("status");
    try {
      const { default: init } = await import("./pkg/bevy_scene.js");
      await init();
      status.hidden = true;
    } catch (err) {
      // winit/Bevy throws a benign control-flow exception when starting its web event loop.
      if (err?.message?.includes("Using exceptions for control flow")) {
        status.hidden = true;
      } else {
        status.textContent =
          "WASM bundle not built yet (expected ./pkg/bevy_scene.js).";
        console.error(err);
      }
    }
  </script>
</body>
</html>
