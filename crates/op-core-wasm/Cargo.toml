[package]
name = "op-core-wasm"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust WebAssembly clinical O&P geometry, rectification, shelling, and dual-CAM kernel."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "=0.2.130"
